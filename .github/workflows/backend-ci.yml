name: Backend CI

on:
  push:
    branches:
      - main
    pull_request:
      branches:
        - main
jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: python -m pip install pipenv
      
      - name: Install dependencies
        run: pipenv install --dev
      
      - name: Run tests
        run: pipenv run test
      
      - name: run lint
        run: pipenv run lint