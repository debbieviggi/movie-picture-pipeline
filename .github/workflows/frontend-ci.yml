name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.14

    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: CI=true npm test -- --watchAll=false

    - name: Build frontend
      run: npm run build
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.14

      - name: Install dependencies
        run: npm ci

      - name: run lint
        run: npm run lint
  build:
    runs-on: ubuntu-latest
    needs:
      - test
      - lint

    defaults:
      run:
        working-directory: starter/frontend
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.14

      - name: Install dependencies
        run: npm ci
        
      - name: build frontend
        run: npm run build